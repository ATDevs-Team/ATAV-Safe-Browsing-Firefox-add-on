<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ATAV Safe Browsing</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1a1a26;
      color: #e1e1e6;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2d2d3f;
    }

    .header img {
      width: 28px;
      height: 28px;
    }

    .header h2 {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }

    .section {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8a8a9e;
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      padding: 8px 10px;
      background-color: #28283a;
      color: #f1f1f5;
      border: 1px solid #3f3f56;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: #6366f1;
    }

    .status-card {
      background-color: #28283a;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #3f3f56;
    }

    .site-url {
      font-family: monospace;
      font-size: 11px;
      color: #9ca3af;
      word-break: break-all;
      margin-bottom: 8px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .status-safe {
      background-color: #10b981;
      color: #ffffff;
    }

    .status-unknown {
      background-color: #d97706;
      color: #ffffff;
    }

    .status-malicious {
      background-color: #ef4444;
      color: #ffffff;
    }

    .status-off {
      background-color: #6b7280;
      color: #ffffff;
    }

    .status-desc {
      font-size: 12px;
      color: #b0b0c2;
      line-height: 1.4;
    }

    .report-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #3f3f56;
    }

    .report-section p {
      font-size: 12px;
      color: #d1d5db;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      flex: 1;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-sm:hover {
      opacity: 0.9;
    }

    .btn-safe {
      background-color: #059669;
      color: #ffffff;
    }

    .btn-danger {
      background-color: #dc2626;
      color: #ffffff;
    }

    .feedback-msg {
      font-size: 11px;
      color: #34d399;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <img id="header-icon" src="dat/good.png" alt="ATAV Icon">
    <h2>ATAV Safe Browsing</h2>
  </div>

  <div class="section">
    <label for="protection-level">Protection Level</label>
    <select id="protection-level">
      <option value="Off">Off (No protection)</option>
      <option value="Normal">Normal (Domain lookup only)</option>
      <option value="Normal Plus">Normal Plus (Domain lookup + monitor requests)</option>
      <option value="Maximum">Maximum (Full URL lookup)</option>
      <option value="Maximum Plus">Maximum Plus (Full URL lookup + monitor requests)</option>
    </select>
  </div>

  <div class="section">
    <label>Current Site Status</label>
    <div class="status-card">
      <div id="site-url" class="site-url">Loading active domain...</div>
      <div id="status-badge" class="status-badge status-safe">Safe</div>
      <div id="status-desc" class="status-desc">Checking current site...</div>

      <div id="unknown-report-container" class="report-section" style="display: none;">
        <p>This website isn't in our database and we have no idea if it's good or bad. You can report it below so we can review it and add it to our database:</p>
        <div class="btn-group">
          <button id="report-safe-btn" class="btn-sm btn-safe">Report Safe</button>
          <button id="report-malicious-btn" class="btn-sm btn-danger">Report Dangerous</button>
        </div>
        <div id="feedback-msg" class="feedback-msg"></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
