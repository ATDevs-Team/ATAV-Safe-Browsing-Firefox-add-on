<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Blocked - ATAV Safe Browsing</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <img src="dat/warn.png" alt="Warning Icon" class="warning-icon">
    </div>
    <h1>Warning: Potentially Unsafe Site Blocked</h1>
    <p class="description">
      ATAV Safe Browsing has blocked access to this page to protect your device and privacy.
    </p>
    <div class="url-box">
      <strong>Target URL:</strong>
      <span id="blocked-url-display">Loading target site URL...</span>
    </div>
    <div class="actions">
      <button id="go-back-btn" class="btn btn-primary">Go Back to Safety</button>
      <button id="allow-temp-btn" class="btn btn-danger">Temporarily Allow Website</button>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
